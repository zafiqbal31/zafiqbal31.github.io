}
body::before{

}
.wrap{

/* ---- index bar ---- */
.index{

  background:var(--surface); border-bottom:1px solid var(--rule);
}
.index .wrap{
  display:flex; flex-wrap:wrap; gap:.25rem 1.25rem; align-items:center;
  padding-block:.6rem;
}
.index a{
  color:var(--muted); text-decoration:none; font-size:.8rem; font-weight:500;
  letter-spacing:.04em; text-transform:uppercase;
}
.index a:hover,.index a:focus-visible{color:var(--accent)}
.index .me{
